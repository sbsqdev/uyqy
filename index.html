<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Charter Key — crew platform for race programmes</title>
<meta name="description" content="The crew platform for sailing programmes: berth tiers, a race calendar, an academy, membership, city maps and two AI assistants. Any venue, any fleet.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/styles.css?v=7">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>⛵</text></svg>">
</head>
<body>

<div class="bg-grain" aria-hidden="true"></div>

<header class="topbar" id="top">
  <a class="brand" href="#top">
    <span class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 32 32" width="30" height="30">
        <path d="M16 2 L24 18 H8 Z" fill="currentColor" opacity=".92"/>
        <circle cx="16" cy="23" r="4" fill="none" stroke="currentColor" stroke-width="2.4"/>
        <path d="M16 27 v4 M16 30 h3.5 M16 28 h2.6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" fill="none"/>
      </svg>
    </span>
    <span class="brand-text">Charter Key<em data-i18n="brand.tagline"></em></span>
  </a>

  <nav class="nav" id="nav">
    <a href="#berths" data-nav data-i18n="nav.berths">Berths</a>
    <a href="#calendar" data-nav data-i18n="nav.calendar">Calendar</a>
    <a href="#academy" data-nav data-i18n="nav.academy">Academy</a>
    <a href="#map" data-nav data-i18n="nav.map">The town</a>
    <a href="#ai" data-nav data-i18n="nav.ai">AI help</a>
    <a href="#account" data-nav data-i18n="nav.account">Account</a>
  </nav>

  <div class="topbar-right">
    <div class="lang" role="group" aria-label="Language">
      <button data-lang="en" type="button">EN</button>
      <button data-lang="ru" type="button">RU</button>
    </div>
    <button class="pts-chip" id="ptsChip" type="button">
      <span class="pts-dot" aria-hidden="true"></span>
      <b id="ptsChipValue">0</b><span class="pts-unit" id="ptsChipUnit">points</span>
    </button>
    <button class="btn btn-primary btn-sm" data-auth type="button" id="authBtn">Sign up</button>
    <button class="burger" id="burger" type="button" aria-label="Menu"><span></span><span></span><span></span></button>
  </div>
</header>

<main>
  <!-- ══ HERO ══ -->
  <section class="hero">
    <div class="hero-glow" aria-hidden="true"></div>
    <div class="wrap hero-inner">
      <div class="hero-copy">
        <span class="eyebrow"><i class="live-dot"></i><span id="eyebrow"></span></span>
        <h1><span data-i18n="hero.h1a"></span><br><span class="grad" data-i18n="hero.h1b"></span></h1>
        <p class="lede" data-i18n="hero.lede"></p>
        <div class="hero-cta">
          <button class="btn btn-primary" data-scroll="#quiz" type="button"><span data-i18n="hero.ctaQuiz"></span> <span class="kbd" data-i18n="hero.ctaQuizNote"></span></button>
          <button class="btn btn-ghost" data-scroll="#calendar" type="button" data-i18n="hero.ctaCal"></button>
        </div>
        <ul class="hero-stats">
          <li><b>3</b><span data-i18n="hero.statTiers"></span></li>
          <li><b id="statEvents">9</b><span data-i18n="hero.statEvents"></span></li>
          <li><b id="statCheckins">0</b><span data-i18n="hero.statCheckins"></span></li>
        </ul>
      </div>

      <aside class="hero-card">
        <div class="hc-head">
          <span class="hc-label" data-i18n="hc.label"></span>
          <span class="hc-badge" id="hcBadge"></span>
        </div>
        <h3 id="hcName"></h3>
        <p class="hc-sub" id="hcLine"></p>
        <div class="hc-rows">
          <div><span data-i18n="hc.fleet"></span><b id="hcFleet"></b></div>
          <div><span data-i18n="hc.wind"></span><b id="hcWind"></b></div>
          <div><span data-i18n="hc.spots"></span><b id="hcSpots"></b></div>
        </div>
        <div class="hc-foot">
          <button class="btn btn-soft btn-sm" id="hcJoin" type="button"></button>
          <button class="btn btn-link btn-sm" data-scroll="#calendar" type="button" data-i18n="hc.calendar"></button>
        </div>
      </aside>
    </div>
  </section>

  <!-- ══ VENUES ══ -->
  <section class="section section-alt" id="venues">
    <div class="wrap">
      <div class="sec-head">
        <div>
          <span class="sec-kicker" data-i18n="venue.kicker"></span>
          <h2 data-i18n="venue.h2"></h2>
        </div>
        <p class="sec-note" data-i18n="venue.note"></p>
      </div>
      <div class="venue-grid" id="venueTabs" role="tablist"></div>
    </div>
  </section>

  <!-- ══ BERTHS ══ -->
  <section class="section" id="berths">
    <div class="wrap">
      <div class="sec-head">
        <div>
          <span class="sec-kicker" data-i18n="berths.kicker"></span>
          <h2 data-i18n="berths.h2"></h2>
        </div>
        <p class="sec-note" data-i18n="berths.note"></p>
      </div>
      <div class="tier-grid" id="tierGrid"></div>

      <div class="magnet" id="magnet">
        <div>
          <span class="sec-kicker" data-i18n="magnet.free"></span>
          <h3 id="magnetTitle"></h3>
          <p class="muted" id="magnetSub"></p>
          <ul class="magnet-list" id="magnetList"></ul>
        </div>
        <div class="magnet-cta">
          <button class="btn btn-primary" data-auth type="button" id="magnetBtn"></button>
          <p class="muted" id="magnetNote"></p>
        </div>
      </div>
    </div>
  </section>

  <!-- ══ QUIZ ══ -->
  <section class="section section-alt" id="quiz">
    <div class="wrap">
      <div class="sec-head">
        <div>
          <span class="sec-kicker" data-i18n="quiz.kicker"></span>
          <h2 data-i18n="quiz.h2"></h2>
        </div>
        <p class="sec-note" data-i18n="quiz.note"></p>
      </div>
      <div class="quiz" id="quizBox"></div>
    </div>
  </section>

  <!-- ══ CALENDAR ══ -->
  <section class="section" id="calendar">
    <div class="wrap">
      <div class="sec-head">
        <div>
          <span class="sec-kicker" data-i18n="cal.kicker"></span>
          <h2 data-i18n="cal.h2"></h2>
        </div>
        <p class="sec-note" data-i18n="cal.note"></p>
      </div>
      <div class="reg-grid" id="regGrid"></div>
    </div>
  </section>

  <!-- ══ ACADEMY + CLUB ══ -->
  <section class="section section-alt" id="academy">
    <div class="wrap">
      <div class="sec-head">
        <div>
          <span class="sec-kicker" data-i18n="academy.kicker"></span>
          <h2 data-i18n="academy.h2"></h2>
        </div>
        <p class="sec-note" data-i18n="academy.note"></p>
      </div>
      <div class="academy-layout">
        <div class="course-grid" id="courseGrid"></div>
        <aside class="club-card" id="clubCard"></aside>
      </div>
    </div>
  </section>

  <!-- ══ THE TOWN ══ -->
  <section class="section" id="map">
    <div class="wrap">
      <div class="sec-head">
        <div>
          <span class="sec-kicker" id="mapKicker"></span>
          <h2 data-i18n="map.h2"></h2>
        </div>
        <p class="sec-note" data-i18n="map.note"></p>
      </div>

      <div class="city-meta" id="cityMeta"></div>

      <div class="map-layout">
        <div class="map-side">
          <div class="search-box">
            <span aria-hidden="true">⌕</span>
            <input type="search" id="searchInput" data-i18n-ph="map.search" aria-label="Search places">
          </div>
          <div class="filters" id="filters" role="group"></div>
          <div class="poi-list" id="poiList"></div>
        </div>

        <div class="map-stage">
          <div class="map-canvas" id="mapCanvas">
            <svg class="map-svg" id="mapSvg" role="img" aria-label="Map"></svg>
            <div class="pins" id="pins"></div>
            <div class="map-legend" id="mapLegend"></div>
            <div class="compass" aria-hidden="true">
              <svg viewBox="0 0 60 60"><circle cx="30" cy="30" r="27" fill="none" stroke="currentColor" stroke-opacity=".35"/><path d="M30 8 L35 30 L30 26 L25 30 Z" fill="currentColor"/><path d="M30 52 L25 30 L30 34 L35 30 Z" fill="currentColor" opacity=".35"/><text x="30" y="7" text-anchor="middle" font-size="8" fill="currentColor">N</text></svg>
            </div>
          </div>
          <div class="poi-detail" id="poiDetail" hidden></div>
        </div>
      </div>

      <div class="coll-grid" id="collGrid"></div>
    </div>
  </section>

  <!-- ══ TWO AIs ══ -->
  <section class="section section-alt" id="ai">
    <div class="wrap">
      <div class="sec-head">
        <div>
          <span class="sec-kicker" data-i18n="ai.kicker"></span>
          <h2 data-i18n="ai.h2"></h2>
        </div>
        <p class="sec-note" data-i18n="ai.note"></p>
      </div>

      <div class="guide-layout">
        <div class="chat" id="chat">
          <div class="chat-tabs" role="tablist">
            <button class="chat-tab" data-mode="assistant" role="tab" aria-selected="true" type="button">
              <span class="ct-ico" aria-hidden="true">🔑</span>
              <span><b data-i18n="ai.tabCrew"></b><em data-i18n="ai.tabCrewSub"></em></span>
            </button>
            <button class="chat-tab" data-mode="guide" role="tab" aria-selected="false" type="button">
              <span class="ct-ico" aria-hidden="true">🧭</span>
              <span><b data-i18n="ai.tabTown"></b><em id="tabTownSub"></em></span>
            </button>
            <button class="btn btn-link btn-sm" id="chatReset" type="button" data-i18n="ai.clear"></button>
          </div>
          <div class="chat-log" id="chatLog" aria-live="polite"></div>
          <div class="chat-chips" id="chatChips"></div>
          <form class="chat-input" id="chatForm">
            <input id="chatInput" type="text" autocomplete="off" data-i18n-ph="ai.placeholder" aria-label="Your question">
            <button class="btn btn-primary btn-sm" type="submit" data-i18n="ai.send"></button>
          </form>
        </div>

        <aside class="guide-aside">
          <div class="card">
            <h3 id="gaTitle"></h3>
            <ul class="ga-list" id="gaList"></ul>
          </div>
          <div class="card ga-facts">
            <h3 data-i18n="ai.boat"></h3>
            <div class="ga-row"><span data-i18n="ai.boatClass"></span><b id="boatType"></b></div>
            <div id="boatSpecs"></div>
          </div>
        </aside>
      </div>
    </div>
  </section>

  <!-- ══ PLATFORM ══ -->
  <section class="section" id="platform">
    <div class="wrap">
      <div class="sec-head">
        <div>
          <span class="sec-kicker" data-i18n="platform.kicker"></span>
          <h2 data-i18n="platform.h2"></h2>
        </div>
        <p class="sec-note" data-i18n="platform.note"></p>
      </div>
      <div class="plat-grid">
        <article class="plat"><h3 data-i18n="platform.c1t"></h3><p data-i18n="platform.c1l"></p></article>
        <article class="plat"><h3 data-i18n="platform.c2t"></h3><p data-i18n="platform.c2l"></p></article>
        <article class="plat"><h3 data-i18n="platform.c3t"></h3><p data-i18n="platform.c3l"></p></article>
      </div>
      <div class="plat-cta">
        <button class="btn btn-primary" id="platformCta" type="button" data-i18n="platform.cta"></button>
        <span class="muted" data-i18n="platform.ctaNote"></span>
      </div>
    </div>
  </section>

  <!-- ══ FAQ ══ -->
  <section class="section" id="faq">
    <div class="wrap">
      <div class="sec-head">
        <div>
          <span class="sec-kicker" data-i18n="faq.kicker"></span>
          <h2 data-i18n="faq.h2"></h2>
        </div>
        <p class="sec-note" data-i18n="faq.note"></p>
      </div>
      <div class="faq" id="faqList"></div>
    </div>
  </section>

  <!-- ══ ACCOUNT ══ -->
  <section class="section section-alt" id="account">
    <div class="wrap">
      <div class="sec-head">
        <div>
          <span class="sec-kicker" data-i18n="account.kicker"></span>
          <h2 data-i18n="account.h2"></h2>
        </div>
        <p class="sec-note" data-i18n="account.note"></p>
      </div>

      <div class="auth-gate" id="authGate" hidden>
        <div>
          <b data-i18n="gate.title"></b>
          <p class="muted" id="gateText"></p>
        </div>
        <button class="btn btn-primary" data-auth type="button" id="gateCta"></button>
      </div>

      <div class="profile-grid">
        <article class="card profile-card">
          <div class="pf-top">
            <div class="avatar" id="avatar">?</div>
            <div class="pf-id">
              <input class="pf-name" id="pfName" value="" aria-label="Your name" maxlength="28">
              <span class="pf-role" id="pfRole"></span>
            </div>
            <div class="pf-pts"><b id="pfPts">0</b><span id="pfPtsLabel"></span></div>
          </div>

          <div class="level">
            <div class="level-row"><span id="lvCur"></span><span id="lvNext"></span></div>
            <div class="level-bar"><i id="lvFill" style="width:0%"></i></div>
            <div class="level-ticks" id="lvTicks"></div>
          </div>

          <div class="pf-stats">
            <div><b id="pfCheckins">0</b><span data-i18n="account.checkins"></span></div>
            <div><b id="pfEvents">0</b><span data-i18n="account.events"></span></div>
            <div><b id="pfRefs">0</b><span data-i18n="account.friends"></span></div>
            <div><b id="pfRewards">0</b><span data-i18n="account.rewards"></span></div>
          </div>
        </article>

        <article class="card ref-card">
          <h3 data-i18n="ref.title"></h3>
          <p class="muted" id="refText"></p>
          <div class="ref-link">
            <input id="refLink" readonly aria-label="Referral link">
            <button class="btn btn-soft btn-sm" id="refCopy" type="button" data-i18n="ref.copy"></button>
          </div>
          <div class="ref-progress">
            <div class="ref-dots" id="refDots"></div>
            <span class="muted" id="refHint"></span>
          </div>
          <ul class="ref-tiers" id="refTiers"></ul>
          <button class="btn btn-ghost btn-sm" id="refSim" type="button" data-i18n="ref.invite"></button>
        </article>

        <article class="card rewards-card">
          <h3 data-i18n="rewards.title"></h3>
          <div class="rewards" id="rewards"></div>
        </article>

        <article class="card log-card">
          <h3 data-i18n="log.title"></h3>
          <ul class="log" id="activityLog"></ul>
          <button class="btn btn-link btn-sm" id="resetAll" type="button" data-i18n="log.reset"></button>
        </article>
      </div>
    </div>
  </section>
</main>

<footer class="footer">
  <div class="wrap footer-inner">
    <div>
      <b>Charter Key</b>
      <p class="muted" data-i18n="footer.text"></p>
    </div>
    <nav class="footer-nav">
      <a href="#berths" data-i18n="nav.berths"></a>
      <a href="#calendar" data-i18n="nav.calendar"></a>
      <a href="#academy" data-i18n="nav.academy"></a>
      <a href="#faq">FAQ</a>
      <a href="#account" data-i18n="nav.account"></a>
    </nav>
  </div>
</footer>

<div class="modal" id="authModal" hidden>
  <div class="modal-backdrop" data-auth-close></div>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="authTitle">
    <button class="modal-x" data-auth-close type="button" aria-label="Close">✕</button>
    <span class="sec-kicker" data-i18n="modal.kicker"></span>
    <h3 id="authTitle"></h3>
    <ul class="auth-perks">
      <li id="perk1"></li>
      <li id="perk2"></li>
      <li id="perk3"></li>
    </ul>
    <form id="authForm" novalidate>
      <label class="field">
        <span data-i18n="modal.name"></span>
        <input id="authName" name="name" autocomplete="name" data-i18n-ph="modal.namePh" required>
      </label>
      <label class="field">
        <span data-i18n="modal.email"></span>
        <input id="authEmail" name="email" type="email" autocomplete="email" data-i18n-ph="modal.emailPh" required>
      </label>
      <label class="field">
        <span><span data-i18n="modal.promo"></span> <i data-i18n="modal.promoOpt"></i></span>
        <input id="authPromo" name="promo" data-i18n-ph="modal.promoPh">
      </label>
      <p class="auth-error" id="authError" hidden></p>
      <button class="btn btn-primary" type="submit" id="authSubmit"></button>
      <p class="auth-note" data-i18n="modal.note"></p>
    </form>
  </div>
</div>

<div class="toast-wrap" id="toasts" aria-live="polite"></div>

<script src="assets/js/i18n.js?v=7"></script>
<script src="assets/js/data.js?v=7"></script>
<script src="assets/js/map.js?v=7"></script>
<script src="assets/js/guide.js?v=7"></script>
<script src="assets/js/assistant.js?v=7"></script>
<script src="assets/js/app.js?v=7"></script>
</body>
</html>
